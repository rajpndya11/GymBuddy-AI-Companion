<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Optional (Transparent or Dark) -->
  <rect width="500" height="500" fill="#0A0A0A" rx="100" />

  <!-- Inner Subtle Ring -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#222222" stroke-width="2" />

  <g transform="translate(25, 20) scale(0.9)">
    <!-- 1. White Muscular Flexing Arm Contour (Forms the upper and left curve of 'G') -->
    <!-- Starts at elbow base, curves around bicep peak, curls into clenched fist with knuckle/thumb notch, and loops inner crook -->
    <path
      d="M 185 272 
         C 165 258, 142 225, 142 185
         C 142 125, 185 80, 252 80
         C 285 80, 316 92, 332 108
         C 338 114, 335 125, 325 130
         C 310 137, 298 135, 290 128
         C 280 120, 268 116, 250 116
         C 205 116, 178 145, 178 186
         C 178 212, 190 234, 206 246
         C 225 210, 255 186, 295 180
         C 310 178, 322 184, 325 195
         C 328 206, 318 218, 304 222
         C 272 230, 245 250, 230 282
         C 222 298, 202 300, 192 288
         Z"
      fill="#FFFFFF"
    />

    <!-- Muscular Bicep & Forearm Accent / Detailed Shading (Pure crisp vector) -->
    <!-- The Main Stylized Flexing Arm Emblem: Top arc + Peak + Fist -->
    <path
      d="M 235 90
         C 205 90, 168 115, 155 160
         C 142 205, 158 255, 192 285
         C 172 260, 168 220, 176 182
         C 184 140, 218 118, 255 118
         C 278 118, 298 126, 312 138
         C 322 147, 335 142, 338 130
         C 342 118, 332 108, 320 98
         C 295 86, 268 90, 235 90
         Z"
      fill="#FFFFFF"
      opacity="0.95"
    />

    <!-- 2. Electric Lime Green Kinetic Hook / Wing (Forms the bottom loop and horizontal crossbar of 'G') -->
    <path
      d="M 218 305
         C 238 318, 265 324, 295 320
         C 345 312, 382 275, 382 225
         C 382 215, 375 208, 364 208
         L 282 208
         C 272 208, 265 215, 265 224
         C 265 233, 272 240, 282 240
         L 345 240
         C 340 268, 315 292, 285 294
         C 262 296, 242 288, 230 276
         L 218 305
         Z"
      fill="#C7FF3D"
      filter="url(#neon-glow)"
    />
  </g>
</svg>
